version: 2
n_challenges: 15
tiers:
  jaxlib_kernel: 10
  xla_core: 5
challenges:
- id: linalg_lu_getrf
  tier: jaxlib_kernel
  title: LU decomposition (getrf)
  file: jaxlib/gpu/solver_kernels_ffi.cc
  region: GetrfImpl / EVOLVE-BLOCK
  why: LU backs jnp.linalg.solve/inv/det and every linear-solve-heavy program.
  build:
    target: //jaxlib/cuda:_solver
    flags:
    - --config=cuda_libraries_from_stubs
    rebuild_s: 7.0
    so_path: jax_cuda12_plugin/_solver.so
    xla_override: false
    command: bazel build --repo_env=HERMETIC_PYTHON_VERSION=3.12 --disk_cache=/data/bazel-disk
      --features=-layering_check --config=cuda_libraries_from_stubs //jaxlib/cuda:_solver
  test:
    workload: lu
    sizes:
    - 256
    - 512
    - 1024
    - 2048
    dtypes:
    - f32
    - f64
    - c64
    - c128
    devices:
    - gpu
    - cpu
    - tpu
    correctness: lu_reconstruct
  pytests:
  - tests/test_challenges.py::test_challenge_correct[linalg_lu_getrf]
  - tests/test_correctness.py::test_task_correct[lu*]
  - tests/test_integration.py
  vals:
  - correctness_residual
  - latency_ms
  - throughput_gflops
  - speedup_vs_stock
