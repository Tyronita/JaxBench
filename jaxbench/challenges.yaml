- id: xla_scan_expander
  tier: xla_core
  title: Scan lowering (jax.lax.scan)
  file: xla/service/scan_expander.cc
  region: ExpandInstruction / scan->while lowering
  why: THE 'scan expensive operations' target. jax.lax.scan lowers through this; RNNs,
    ODE integrators, cumulative ops, associative scans. Optimizing the lowering makes
    a huge class of programs faster.
  build:
    target: //jaxlib/tools:jax_cuda12_plugin_wheel
    flags:
    - --config=cuda_libraries_from_stubs
    rebuild_s: 60.0
    so_path: null
    xla_override: true
    command: bazel build --repo_env=HERMETIC_PYTHON_VERSION=3.12 --disk_cache=/data/bazel-disk
      --features=-layering_check --config=cuda_libraries_from_stubs --override_repository=xla=/data/xla-local
      //jaxlib/tools:jax_cuda12_plugin_wheel
  test:
    workload: scan_cumsum
    sizes:
    - 1024
    - 8192
    - 65536
    dtypes:
    - f32
    - f64
    devices:
    - gpu
    - cpu
    - tpu
    correctness: scan_vs_reference
  pytests:
  - tests/test_challenges.py::test_challenge_correct[xla_scan_expander]
  - tests/test_xla_core.py
  vals:
  - correctness_residual
  - compile_time_ms
  - exec_latency_ms
  - speedup_vs_stock
