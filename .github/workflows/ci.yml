name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip install "jax[cpu]>=0.4"
      - name: Registry integrity (exactly 100 tasks)
        run: |
          python - <<'PY'
          from jaxbench import registry
          ts = registry.tasks()
          assert len(ts) == 100, len(ts)
          assert len({t.id for t in ts}) == 100, "duplicate task ids"
          print("registry ok:", len(ts), "tasks")
          PY
      - name: CPU correctness + integration (GPU tasks auto-skip)
        env: { JAX_ENABLE_X64: "1", JAX_PLATFORMS: "cpu" }
        run: pytest tests/test_correctness.py tests/test_integration.py tests/test_build.py -q
